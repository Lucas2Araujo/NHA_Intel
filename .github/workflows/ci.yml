name: CI/CD Pipeline - Hinário Inteligente

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  test:
    name: Run Async Unit Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio aiosqlite yt-dlp flet

      - name: Run Pytest Test Suite
        run: |
          pytest -v

      - name: Update Dynamic Test Count in README
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          TOTAL_TESTS=$(pytest --collect-only -q | grep -E "^tests/.*::" | wc -l)
          echo "Total de testes detectados: $TOTAL_TESTS"
          python -c "
          import re
          count = '$TOTAL_TESTS'
          with open('README.md', 'r', encoding='utf-8') as f:
              content = f.read()
          content = re.sub(r'Testes-[0-9]+%20passando', f'Testes-{count}%20passando', content)
          content = re.sub(r'\*\*[0-9]+ testes assíncronos\*\*', f'**{count} testes assíncronos**', content)
          content = re.sub(r'[0-9]+ testes unitários', f'{count} testes unitários', content)
          content = re.sub(r'completa de [0-9]+ testes', f'completa de {count} testes', content)
          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(content)
          "
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --quiet HEAD README.md; then
            git commit -m "docs: atualizar contagem de testes no README para $TOTAL_TESTS [skip ci]"
            git push
          else
            echo "README.md já está atualizado com a contagem de testes."
          fi
