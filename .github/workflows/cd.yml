name: CD Pipeline - Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      custom_version:
        description: 'Versão customizada da Release (ex: 0.2 ou v0.2). Deixe em branco para auto-incrementar.'
        required: false
        default: ''
      is_prerelease:
        description: 'Marcar como Pré-Release (Beta)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Next Version Tag
        id: version
        run: |
          git fetch --tags --force || true
          INPUT_VERSION="${{ inputs.custom_version }}"
          
          if [ -n "$INPUT_VERSION" ]; then
            if [[ "$INPUT_VERSION" =~ ^v ]]; then
              TAG="$INPUT_VERSION"
            else
              TAG="v$INPUT_VERSION"
            fi
          else
            LATEST_TAG=$(git tag -l "v*" | sort -V | tail -n 1)
            
            if [ -z "$LATEST_TAG" ]; then
              TAG="v0.1"
            else
              CLEAN_TAG="${LATEST_TAG#v}"
              MAJOR=$(echo "$CLEAN_TAG" | cut -d. -f1)
              MINOR=$(echo "$CLEAN_TAG" | cut -d. -f2)

              MAJOR=${MAJOR:-0}
              MINOR=${MINOR:-0}

              MINOR=$((MINOR + 1))
              if [ "$MINOR" -ge 10 ]; then
                MAJOR=$((MAJOR + 1))
                MINOR=0
              fi

              TAG="v${MAJOR}.${MINOR}"
            fi
          fi
          
          echo "Calculated Version Tag: $TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=Hinário Inteligente $TAG" >> $GITHUB_OUTPUT

      - name: Set up Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite Verification
        run: |
          pytest -v

      - name: Build Android APK via Flet
        run: |
          flet build apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hinario_Inteligente_Android_APK_${{ steps.version.outputs.tag }}
          path: build/apk/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/apk/*.apk
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.title }}
          prerelease: ${{ inputs.is_prerelease != false }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


