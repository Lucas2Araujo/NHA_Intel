name: CD Pipeline - Build & Release Android Split APKs

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-android:
    name: Build & Release Android Split APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate SemVer & Create Git Tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: v
          release_branches: main,master
          fetch_all_tags: true
          custom_release_rules: "feat:minor:🚀 Novas Funcionalidades,fix:patch:🐛 Correções de Bugs,perf:patch:⚡ Melhorias de Performance,refactor:patch:♻️ Refatoração,docs:none:📚 Documentação,style:none:💄 Estilo de Código,chore:none:🔧 Tarefas e Manutenção,ci:none:🤖 CI/CD"

      - name: Set up Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          cache: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Inject Version into src/version.py
        run: |
          echo "Injetando versão calculada: ${{ steps.tag_version.outputs.new_version }}"
          python -c "
          with open('src/version.py', 'w', encoding='utf-8') as f:
              f.write('\"\"\"Módulo gerado automaticamente pelo pipeline de CD.\"\"\"\n\n__version__ = \"${{ steps.tag_version.outputs.new_version }}\"\n')
          "
          echo "Conteúdo de src/version.py:"
          cat src/version.py

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite Verification
        run: |
          pytest -v

      - name: Clean Temporary Asset Files
        run: |
          rm -f assets/*.db-wal assets/*.db-shm

      - name: Build Android Split APKs via Flet
        run: |
          flet build apk --build-version "${{ steps.tag_version.outputs.new_version }}" --build-number ${{ github.run_number }} --split-per-abi -v

      - name: Organize and Rename Split APKs
        id: organize_apks
        run: |
          mkdir -p release_apks
          TAG="${{ steps.tag_version.outputs.new_tag }}"

          echo "APKs brutos encontrados em build/apk:"
          ls -la build/apk/

          # Mapeamento do APK Normal (64-bit moderno)
          ARM64_APK=$(find build/apk -name "*arm64-v8a*.apk" | head -n 1)
          if [ -n "$ARM64_APK" ]; then
            cp "$ARM64_APK" "release_apks/Hinario_Inteligente_${TAG}_Android_Normal_arm64.apk"
            echo "Criado: Hinario_Inteligente_${TAG}_Android_Normal_arm64.apk"
          fi

          # Mapeamento do APK Legado (32-bit aparelhos antigos)
          ARMV7_APK=$(find build/apk -name "*armeabi-v7a*.apk" | head -n 1)
          if [ -n "$ARMV7_APK" ]; then
            cp "$ARMV7_APK" "release_apks/Hinario_Inteligente_${TAG}_Android_Legado_armv7.apk"
            echo "Criado: Hinario_Inteligente_${TAG}_Android_Legado_armv7.apk"
          fi

          # Mapeamento do APK para Emuladores / x86_64
          X86_64_APK=$(find build/apk -name "*x86_64*.apk" | head -n 1)
          if [ -n "$X86_64_APK" ]; then
            cp "$X86_64_APK" "release_apks/Hinario_Inteligente_${TAG}_Android_x86_64.apk"
            echo "Criado: Hinario_Inteligente_${TAG}_Android_x86_64.apk"
          fi

          # Fallback de segurança se os nomes variarem
          if [ -z "$(ls -A release_apks)" ]; then
            echo "Fallback: Copiando todos os APKs encontrados..."
            for f in $(find build/apk -name "*.apk"); do
              BASE=$(basename "$f")
              cp "$f" "release_apks/Hinario_Inteligente_${TAG}_Android_${BASE}"
            done
          fi

          echo "Arquivos finais preparados para assinatura:"
          ls -la release_apks/

      - name: Sign APKs with Android Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.jks
          BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -mindepth 1 -maxdepth 1 | sort -V | tail -n 1)

          for apk in release_apks/*.apk; do
            echo "Assinando $apk..."
            $BUILD_TOOLS/apksigner sign \
              --ks release.jks \
              --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
              --ks-pass pass:"${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
              --key-pass pass:"${{ secrets.ANDROID_KEY_PASSWORD }}" \
              "$apk"
          done

          rm -f release.jks
          echo "Todos os APKs foram assinados com sucesso!"

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Hinario_Inteligente_Android_APKs_${{ steps.tag_version.outputs.new_tag }}
          path: release_apks/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Hinário Inteligente ${{ steps.tag_version.outputs.new_tag }}
          body: |
            ${{ steps.tag_version.outputs.changelog }}

            ---
            ### 📱 Downloads do Aplicativo (Android)
            * **Normal (Recomendado)**: `Hinario_Inteligente_${{ steps.tag_version.outputs.new_tag }}_Android_Normal_arm64.apk` *(Para a grande maioria dos smartphones modernos - 64 bits)*
            * **Legado**: `Hinario_Inteligente_${{ steps.tag_version.outputs.new_tag }}_Android_Legado_armv7.apk` *(Para aparelhos Android antigos - 32 bits)*
          files: release_apks/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}