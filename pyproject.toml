[project]
name = "hinario-inteligente"
version = "0.2"
description = "Hinário Adventista Inteligente — App completo com busca, favoritos, áudio e Agente Organizador de Cultos"

[tool.flet.app]
assets_dir = "assets"
icon = "icon.ico"

[tool.flet.android]
permissions = [
    "android.permission.INTERNET",
    "android.permission.REQUEST_INSTALL_PACKAGES",
    "android.permission.READ_EXTERNAL_STORAGE",
    "android.permission.WRITE_EXTERNAL_STORAGE",
]

[tool.pyright]
extraPaths = ["."]
venvPath = "."
venv = ".venv"


